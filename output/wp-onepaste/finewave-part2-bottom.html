<style>
#fwv2{background:#000; color:#eef3f9;
  font-family:"Pretendard",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-weight:300; line-height:1.8; font-size:17px; -webkit-font-smoothing:antialiased;
  width:100vw; margin-left:calc(50% - 50vw); margin-right:calc(50% - 50vw);
  padding:10px 24px 110px}
#fwv2 .sec-in{max-width:1140px; margin:0 auto}
#fwv2 .foot{border-top:1px solid rgba(255,255,255,.1); padding-top:36px; text-align:center;
  color:#8b96a5 !important; font-size:14px; line-height:2}
#fwv2 .foot b{color:#c9d3df; font-weight:400; letter-spacing:.12em}
#fwv2 .foot .finemec{display:inline-flex; align-items:center; gap:14px; background:#fff; border-radius:8px;
  padding:10px 18px; margin-bottom:26px; text-decoration:none}
#fwv2 .foot .finemec img{height:22px; width:auto; display:block}
#fwv2 .foot .finemec span{color:#1b2a63 !important; font-size:13px; font-weight:500}

/* ── 플로팅 버튼 (우측 세로 중앙 고정) ── */
#fwfloat{position:fixed; right:24px; top:50%; transform:translateY(-50%); z-index:999;
  display:flex; flex-direction:column; gap:12px; align-items:center}
#fwfloat .btn{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  width:74px; height:74px; background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.28); border-radius:10px;
  color:#fff !important; text-decoration:none; cursor:pointer; backdrop-filter:blur(2px);
  transition:opacity .25s, transform .25s; font-size:13px; font-family:inherit}
#fwfloat .btn:hover{transform:translateY(-2px)}
#fwfloat svg{width:24px; height:24px; fill:none; stroke:#fff; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
@media(max-width:760px){#fwfloat{right:12px}
#fwfloat .btn{width:56px; height:56px; border-radius:8px; font-size:10px}
#fwfloat svg{width:18px; height:18px}}
</style>

      ⓒ Copyright 2026 Finemec All Right Reserved.
    </div>
  </div>
</div>

<div id="fwfloat" role="navigation" aria-label="빠른 메뉴">
  <a class="btn" href="#contact" aria-label="제품 문의로 이동">
    <svg viewBox="0 0 24 24"><path d="M12 4.5c-4.7 0-8.5 3.1-8.5 7 0 2.2 1.2 4.1 3.1 5.4-.2 1-.7 2.1-1.5 2.9 1.6-.1 3-.7 4.1-1.5.9.3 1.8.4 2.8.4 4.7 0 8.5-3.1 8.5-7s-3.8-7.2-8.5-7.2z"/></svg>

<script>
(function () {
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* 헤더: 투명 → 스크롤 시 다크 */
  var hd = document.getElementById('fwhd');
  if (hd) {
    var onScroll = function () { hd.classList.toggle('solid', window.scrollY > 40); };
    window.addEventListener('scroll', onScroll, { passive: true }); onScroll();

    /* 모바일 햄버거 메뉴 */
    var burger = document.getElementById('fwBurger');
    burger.addEventListener('click', function () {
      var open = hd.classList.toggle('open');
      burger.setAttribute('aria-expanded', open ? 'true' : 'false');
      burger.setAttribute('aria-label', open ? '메뉴 닫기' : '메뉴 열기');
    });
    hd.querySelector('nav').addEventListener('click', function (e) {
      if (e.target.closest('a')) {
        hd.classList.remove('open');
        burger.setAttribute('aria-expanded', 'false');
      }
    });
  }

  /* 스크롤 리빌 */
  var els = document.querySelectorAll('#fwv .rv');
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.2 });
    els.forEach(function (el) { io.observe(el); });
  } else { els.forEach(function (el) { el.classList.add('in'); }); }

  /* 360도: 모바일 경량 소스 + 진입 시 1회 재생 */
  var v = document.getElementById('turn');
  if (v) {
    var mob = window.matchMedia('(max-width: 767px)').matches;
    var s = document.createElement('source');
    s.src = mob ? 'https://finewave.kr/wp-content/uploads/2026/07/product-360-640.mp4' : 'https://finewave.kr/wp-content/uploads/2026/07/product-360-960.mp4';
    s.type = 'video/mp4';
    v.appendChild(s); v.load();
    var done = false;
    function go() { if (!reduced && !done) { done = true; var p = v.play(); if (p && p.catch) p.catch(function () {}); } }
    if (!('IntersectionObserver' in window)) { go(); }
    else {
      var t = new IntersectionObserver(function (es) {
        es.forEach(function (e) { if (e.isIntersecting) { go(); t.disconnect(); } });
      }, { threshold: 0.6 });
      t.observe(v);
    }
  }
})();
</script>
