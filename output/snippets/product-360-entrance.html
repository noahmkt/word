<!-- ============================================================
  제품 360° 회전 등장 애니메이션 (Elementor HTML 위젯용, 단일 파일)
  ------------------------------------------------------------
  · 소스: PSD 정면 누끼 기반 AI 생성 턴테이블 영상 (output/product-360/)
    → 클라이언트 시안 컨펌 후 사용 (AI 생성물: 세부 형상 왜곡 여부 확인 필수)
  · 동작: 섹션이 화면에 60% 들어오면 1회 재생(360° 회전 후 정면 정지).
    다시 스크롤해 재진입하면 재재생하지 않음(등장 연출 1회성).
  · '움직임 줄이기' 사용자·자동재생 차단 환경 → 포스터(정면 정지컷) 표시
  · {{VIDEO_URL}} / {{POSTER_URL}} 를 미디어 라이브러리 업로드 URL로 치환
  · 무한 루프로 쓰려면 <video>에 loop 속성을 추가하고 스크립트의
    once 로직은 그대로 두면 됨
  ============================================================ -->

<div class="fw-turn">
  <video class="fw-turn__video"
         muted playsinline preload="metadata"
         poster="{{POSTER_URL}}"
         aria-label="FINEWAVE 장비 360도 회전 뷰">
    <source src="{{VIDEO_URL}}" type="video/mp4">
  </video>
</div>

<style>
  .fw-turn {
    max-width: 960px;
    margin: 0 auto;
    line-height: 0;
    border-radius: 12px;
    overflow: hidden;
  }
  .fw-turn__video {
    width: 100%;
    height: auto;
    display: block;
    /* 등장 시 살짝 확대되며 나타나는 보조 연출 (GPU 합성 속성만 사용) */
    opacity: 0;
    transform: translate3d(0, 10px, 0) scale(0.985);
    transition: opacity .8s ease-out, transform .8s ease-out;
  }
  .fw-turn.fw-is-in .fw-turn__video {
    opacity: 1;
    transform: translate3d(0, 0, 0) scale(1);
  }
  @media (prefers-reduced-motion: reduce) {
    .fw-turn__video {
      opacity: 1;
      transform: none;
      transition: none;
    }
  }
</style>

<script>
  (function () {
    var wrap = document.currentScript.previousElementSibling; /* style */
    var box = document.querySelector('.fw-turn');
    if (!box) return;
    var video = box.querySelector('.fw-turn__video');
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var played = false;

    function reveal() {
      box.classList.add('fw-is-in');
      if (!reduced && !played) {
        played = true;
        var p = video.play();
        if (p && p.catch) p.catch(function () { /* 자동재생 차단 → 포스터 유지 */ });
      }
    }

    if (!('IntersectionObserver' in window)) { reveal(); return; }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { reveal(); io.disconnect(); }
      });
    }, { threshold: 0.6 });
    io.observe(box);
  })();
</script>
