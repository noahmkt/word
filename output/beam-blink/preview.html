<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FINEWAVE 빔 깜빡임 시안 미리보기</title>
<link rel="stylesheet" href="beam-blink.css">
<style>
  /* 미리보기 전용 스타일 (실서비스 적용 파일 아님) */
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    background: linear-gradient(284deg, #1e293b 3%, #000 100%); /* FINECOOL 섹션과 동일 배경 */
    font-family: Roboto, sans-serif;
    color: #fff;
    padding: 40px 16px;
    box-sizing: border-box;
  }
  h1 { font-size: 20px; font-weight: 300; letter-spacing: .5px; margin: 0; }
  p  { font-size: 14px; font-weight: 300; color: #81F0FF; margin: 0; }
  .stage { width: min(900px, 92vw); }
  .hint { color: #9aa7b5; font-size: 12px; }
</style>
</head>
<body>
  <h1>FINECOOL™ 핸드피스 — 빔 깜빡임 시안</h1>
  <p>주기 2.8초 · ease-in-out · 무한 반복 (시스템 '모션 줄이기' 설정 시 정지 화면)</p>

  <div class="stage">
    <figure class="fw-beam">
      <img src="beam-off.webp" alt="FINECOOL 핸드피스 (빔 off)">
      <img class="fw-beam__on" src="beam-on.webp" alt="" aria-hidden="true">
    </figure>
  </div>

  <span class="hint">본 파일은 클라이언트 시안 컨펌용 단독 미리보기입니다. 실제 적용 방법은 apply-guide.md 참조.</span>
</body>
</html>
